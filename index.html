<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The app draws its own light and dark themes: phone browsers must not auto-darken it -->
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auriance</title>
    <meta
      name="description"
      content="Orders, inventory and finance for your team."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="theme-color"
      content="#fbf7f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1a1214"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />

    <!-- Apply the saved theme before the app loads, so dark mode doesn't flash -->
    <script>
      try {
        let theme = localStorage.getItem("theme");
        if (theme === "system" || !theme) {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.classList.add(theme);
      } catch (e) {}
      // and the saved language, so Arabic opens right-to-left from the first paint
      try {
        if (localStorage.getItem("lang") === "ar") {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Auriance Ops needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
